{%- assign S = site.data.site -%}
<script type="application/ld+json">
{
 "@context":"https://schema.org",
 "@graph":[
  {
   "@type":["LocalBusiness","HealthAndBeautyBusiness"],
   "@id":"{{ site.url }}/#business",
   "name":"{{ S.brand.zh }} {{ S.brand.en }}",
   "url":"{{ site.url }}",
   "email":"{{ S.contact.email }}",
   "image":"{{ site.url }}/assets/og.jpg",
   "description":"{{ site.description }}",
   "address":{"@type":"PostalAddress","streetAddress":"{{ S.contact.address_street }}","addressLocality":"{{ S.contact.address_locality }}","addressRegion":"{{ S.contact.address_region }}","postalCode":"{{ S.contact.postal }}","addressCountry":"TW"},
   "geo":{"@type":"GeoCoordinates","latitude":{{ S.contact.lat }},"longitude":{{ S.contact.lng }}},
   "openingHoursSpecification":[{"@type":"OpeningHoursSpecification","dayOfWeek":["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],"opens":"{{ S.hours.open }}","closes":"{{ S.hours.close }}"}],
   "areaServed":[{% for a in site.area %}{"@type":"City","name":"{{ a.title }}"}{% unless forloop.last %},{% endunless %}{% endfor %}],
   "priceRange":"NT$1,580 - NT$4,200",
   "sameAs":["{{ S.contact.facebook }}"],
   "currenciesAccepted":"TWD","paymentAccepted":"現金"
  },
  {
   "@type":"WebSite","@id":"{{ site.url }}/#website",
   "url":"{{ site.url }}","name":"{{ S.brand.zh }} {{ S.brand.en }}",
   "publisher":{"@id":"{{ site.url }}/#business"},"inLanguage":"zh-TW"
  }
  {%- if page.url != '/' -%},
  {
   "@type":"BreadcrumbList","@id":"{{ page.url | absolute_url }}#crumb",
   "itemListElement":[
    {"@type":"ListItem","position":1,"name":"首頁","item":"{{ site.url }}/"}
    {%- if page.parent_url -%},{"@type":"ListItem","position":2,"name":"{{ page.parent_name }}","item":"{{ page.parent_url | absolute_url }}"},
    {"@type":"ListItem","position":3,"name":"{{ page.title }}","item":"{{ page.url | absolute_url }}"}
    {%- else -%},{"@type":"ListItem","position":2,"name":"{{ page.title }}","item":"{{ page.url | absolute_url }}"}
    {%- endif -%}
   ]
  }
  {%- endif -%}
  {%- if page.layout == 'service-page' -%},
  {
   "@type":"Service","@id":"{{ page.url | absolute_url }}#service",
   "name":"{{ page.title }}","serviceType":"到府按摩",
   "description":"{{ page.description }}",
   "provider":{"@id":"{{ site.url }}/#business"},
   "areaServed":[{% for a in site.area %}{"@type":"City","name":"{{ a.title }}"}{% unless forloop.last %},{% endunless %}{% endfor %}],
   "offers":{"@type":"Offer","price":"{{ page.price }}","priceCurrency":"TWD","availability":"https://schema.org/InStock","url":"{{ page.url | absolute_url }}"}
  }
  {%- endif -%}
  {%- if page.layout == 'area-page' -%},
  {
   "@type":"Service","@id":"{{ page.url | absolute_url }}#service",
   "name":"{{ page.title }}到府按摩","serviceType":"到府按摩",
   "description":"{{ page.description }}",
   "provider":{"@id":"{{ site.url }}/#business"},
   "areaServed":{"@type":"City","name":"{{ page.title }}","containedInPlace":{"@type":"City","name":"台南市"}}
  }
  {%- endif -%}
  {%- if page.layout == 'guide-page' -%},
  {
   "@type":"Article","@id":"{{ page.url | absolute_url }}#article",
   "headline":"{{ page.title }}","description":"{{ page.description }}",
   "datePublished":"{{ page.date | default: '2026-08-03' | date: '%Y-%m-%d' }}",
   "dateModified":"{{ page.updated | default: '2026-08-03' | date: '%Y-%m-%d' }}",
   "author":{"@id":"{{ site.url }}/#business"},"publisher":{"@id":"{{ site.url }}/#business"},
   "mainEntityOfPage":"{{ page.url | absolute_url }}","inLanguage":"zh-TW"
  }
  {%- endif -%}
  {%- if page.faq -%},
  {
   "@type":"FAQPage","@id":"{{ page.url | absolute_url }}#faq",
   "mainEntity":[{% for f in page.faq %}{"@type":"Question","name":"{{ f.q }}","acceptedAnswer":{"@type":"Answer","text":"{{ f.a | strip_newlines }}"}}{% unless forloop.last %},{% endunless %}{% endfor %}]
  }
  {%- endif -%}
 ]
}
</script>
