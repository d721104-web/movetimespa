{%- if page.faq -%}
<section class="sec sec-alt">
  <div class="wrap-narrow">
    <div class="eyebrow">常見問題</div>
    <h2>{{ page.faq_title | default: "您可能想知道的事" }}</h2>
    <div style="margin-top:30px">
      {% for f in page.faq %}
      <details{% if forloop.first %} open{% endif %}>
        <summary>{{ f.q }}</summary>
        <div class="a">{{ f.a }}</div>
      </details>
      {% endfor %}
    </div>
  </div>
</section>
{%- endif -%}
