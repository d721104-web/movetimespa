<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ page.seo_title | default: page.title }}</title>
<meta name="description" content="{{ page.description | escape }}">
<meta name="robots" content="{{ page.robots | default: 'index, follow' }}">
<link rel="canonical" href="{{ site.url }}{{ page.url }}">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta property="og:type" content="{{ page.og_type | default: 'article' }}">
<meta property="og:title" content="{{ page.og_title | default: page.title | escape }}">
<meta property="og:description" content="{{ page.og_description | default: page.description | escape }}">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="og:image" content="{{ page.og_image | default: site.data.site.og_image }}">
<meta property="og:locale" content="zh_TW">
<meta property="og:site_name" content="{{ site.data.site.site_name }}">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/guide.css">
{% include analytics.html %}
