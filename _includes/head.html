{%- assign S = site.data.site -%}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }}｜{{ S.brand.zh }} {{ S.brand.en }}{% else %}{{ S.brand.tagline }}推薦｜{{ S.brand.zh }} {{ S.brand.en }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta name="robots" content="{{ page.robots | default: 'index, follow' }}">

<meta property="og:type" content="{{ page.og_type | default: 'website' }}">
<meta property="og:locale" content="zh_TW">
<meta property="og:site_name" content="{{ S.brand.zh }} {{ S.brand.en }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:title" content="{{ page.title | default: S.brand.tagline }}｜{{ S.brand.zh }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta name="twitter:card" content="summary_large_image">

<meta name="geo.region" content="TW-TNN">
<meta name="geo.placename" content="{{ S.contact.address_region }}">
<meta name="geo.position" content="{{ S.contact.lat }};{{ S.contact.lng }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

{% include schema.html %}
